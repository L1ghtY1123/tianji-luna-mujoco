name: tianji-luna-mujoco-guangyu
include:
- path: ../../tianji-algorithms/deploy/luna-algorithms.compose.yaml
services:
  curobo:
    cpus: 1
    image: jodell-curobo:0.2.0-guangyu
    pull_policy: never
    container_name: tianji-luna-curobo-guangyu
    gpus: all
    init: true
    shm_size: 2gb
    restart: unless-stopped
    ports:
    - 8352:8310
    volumes:
    - ../:/opt/jev:ro
    - ../../CAD:/opt/cad:ro
    - demo-curobo-cache:/var/cache/jodell-curobo
    - ../../tianji-algorithms/services:/opt/tianji-algorithms/services:ro
    - ../../tianji-algorithms/manifests:/opt/tianji-algorithms/manifests:ro
    environment:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: /opt/jev/src:/opt/tianji-algorithms/services
      LUNA_CUROBO_PORT: '8310'
      LUNA_CAD_ROOT: /opt/cad
      LUNA_ROBOT_URDF: /opt/jev/assets/marvin_urdf/marvin_with_grippers.urdf
      LUNA_MARVIN_MESHES: /opt/jev/assets/marvin_urdf/meshes
      LUNA_RAG_MESHES: /opt/jev/assets/marvin_urdf/rag100_050/meshes
      TIANJI_ALGORITHMS_ROOT: /opt/tianji-algorithms
    entrypoint:
    - python3
    - -m
    - luna_mujoco.geometry_service
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8310/health',timeout=5)
      interval: 10s
      timeout: 10s
      start_period: 180s
  web:
    cpus: 1.5
    image: tianji-luna-mujoco:0.7.0-cad-distance-guangyu
    pull_policy: never
    container_name: tianji-luna-web-guangyu
    init: true
    restart: unless-stopped
    network_mode: host
    user: ${LUNA_UID:-1000}:${LUNA_GID:-1000}
    environment:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      LP_NUM_THREADS: '2'
      LUNA_DECISIONS_CONFIG_FILE: /opt/jev/openai-config/decisions.json
      LUNA_DECISIONS_TIMEOUT_S: ${LUNA_DECISIONS_TIMEOUT_S:-90}
      LUNA_EXPERIMENT_DIR: /opt/jev/data/experiments
      LUNA_CUROBO_URL: http://127.0.0.1:8352
      LUNA_GRASPGEN_URL: http://127.0.0.1:8363
      LUNA_SAM3_URL: http://127.0.0.1:8362
      LUNA_FOUNDATIONPOSE_URL: http://127.0.0.1:8365
      LUNA_GEOMETRY_MODE: cad_obb
      LUNA_CAD_ROOT: /opt/cad
      PYTHONPATH: /opt/jev/src:/opt/tianji-algorithms/services
      TIANJI_ALGORITHMS_ROOT: /opt/tianji-algorithms
    tmpfs:
    - /opt/jev/web/node_modules:rw,exec,size=512m,uid=${LUNA_UID:-1000},gid=${LUNA_GID:-1000},mode=0755
    volumes:
    - ${OPENAI_CONFIG_DIR:-/home/guangyu/.config/openai-client}:/opt/jev/openai-config:ro
    - ../.env:/opt/jev/.env:ro
    - ../data:/opt/jev/data
    - ../data/render_meshes:/opt/jev/assets/render_meshes
    - ../src:/opt/jev/src:ro
    - ../skill_catalog:/opt/jev/skill_catalog:ro
    - ../resources:/opt/jev/resources:ro
    - ../../CAD:/opt/cad:ro
    - ../web:/opt/jev/web:ro
    - ./run-demo.sh:/opt/jev/deploy/run-demo.sh:ro
    - ../../tianji-algorithms/services:/opt/tianji-algorithms/services:ro
    command:
    - bash
    - /opt/jev/deploy/run-demo.sh
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8350/',timeout=5); urllib.request.urlopen('http://127.0.0.1:8351/api/run-progress',timeout=5)
      interval: 5s
      timeout: 10s
      start_period: 30s
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      additional_contexts:
        algorithm-services: ../../tianji-algorithms/services
volumes:
  demo-curobo-cache: null
