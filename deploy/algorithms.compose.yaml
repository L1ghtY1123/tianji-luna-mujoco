name: tianji-jev-mujoco-guangyu
services:
  sam3:
    image: jodell-sam3:${JEV_ALGORITHM_IMAGE_TAG:-0.2.0-guangyu}
    pull_policy: never
    container_name: jev-mujoco-sam3-guangyu
    gpus: all
    init: true
    shm_size: 2gb
    restart: unless-stopped
    ports: ["8322:8022"]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request, msgpack; request = urllib.request.Request('http://127.0.0.1:8022', data=msgpack.packb({'operation': 'health', 'payload': {}}, use_bin_type=True), headers={'Content-Type': 'application/msgpack'}); result = msgpack.unpackb(urllib.request.urlopen(request, timeout=5).read(), raw=False); assert result.get('ok') and result.get('health', {}).get('status') == 'ok'"]
      interval: 30s
      timeout: 10s
      start_period: 180s
  curobo:
    image: jodell-curobo:${JEV_CUROBO_IMAGE_TAG:-0.2.0-guangyu}
    pull_policy: never
    container_name: jev-mujoco-curobo-guangyu
    gpus: all
    init: true
    shm_size: 2gb
    restart: unless-stopped
    ports: ["8310:8310"]
    volumes:
      - ../:/opt/jev:ro
      - curobo-cache:/var/cache/jodell-curobo
    environment:
      PYTHONPATH: /opt/jev/src:/opt/jev/vendor
      JEV_CUROBO_PORT: "8310"
      JEV_ROBOT_URDF: /opt/jev/assets/marvin_urdf/marvin_with_grippers.urdf
      JEV_MARVIN_MESHES: /opt/jev/assets/marvin_urdf/meshes
      JEV_RAG_MESHES: /opt/jev/assets/marvin_urdf/rag100_050/meshes
    entrypoint: [python3, -m, jev_mujoco.geometry_service]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8310/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
  graspgen:
    image: jodell-graspgen:${JEV_ALGORITHM_IMAGE_TAG:-0.2.0-guangyu}
    pull_policy: never
    container_name: jev-mujoco-graspgen-guangyu
    gpus: all
    init: true
    shm_size: 2gb
    restart: unless-stopped
    ports: ["8323:8323"]
    volumes: ["../vendor:/opt/jev-vendor:ro"]
    environment:
      PYTHONPATH: /opt/jev-vendor
      GAP_GRASPGEN_HOST: 0.0.0.0
      GAP_GRASPGEN_PORT: "8323"
    entrypoint: [python3, -m, tianji_graspgen.service]
    healthcheck:
      test: [CMD, python3, -c, "from tianji_graspgen.client import GraspGenClient; assert GraspGenClient('http://127.0.0.1:8323').health().get('model_ready')"]
      interval: 30s
      timeout: 10s
      start_period: 180s
volumes:
  curobo-cache:
