<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" role="img"><title>一次编排，沿图执行：控制层级</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#536b80"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#20364a;font-size:18px} .small{font-size:15px;fill:#526b80} .title{font-size:24px;font-weight:700} .group{font-size:20px;font-weight:700} .edge{fill:none;stroke:#536b80;stroke-width:2;marker-end:url(#arrow)}</style><rect width="900" height="1080" fill="#fff"/><text x="450" y="38" text-anchor="middle" class="title">一次编排，沿图执行</text><text x="450" y="68" text-anchor="middle" class="small">Graph 是可执行策略；Subgraph 不是 sub-agent</text><rect x="30" y="92" width="840" height="280" rx="16" fill="#f7f9fc" stroke="#a8bacb" stroke-width="1.5"/><text x="50" y="123" text-anchor="start" class="group">01  编排层 · 只调用一次 Responses</text><rect x="90" y="145" width="720" height="50" rx="12" fill="#eaf2fb" stroke="#6587a7" stroke-width="1.5"/><text x="450.0" y="176.0" text-anchor="middle" class="">自然语言 ＋ 初始三相机 RGB ＋ 配置与技能契约</text><rect x="340" y="220" width="220" height="48" rx="12" fill="#eee7fb" stroke="#8a6cad" stroke-width="1.5"/><text x="450.0" y="250.0" text-anchor="middle" class="">Responses</text><rect x="90" y="304" width="340" height="48" rx="12" fill="#eaf2fb" stroke="#6587a7" stroke-width="1.5"/><text x="260.0" y="334.0" text-anchor="middle" class="">Graph：Subgraph、Node、Edge</text><rect x="500" y="304" width="310" height="48" rx="12" fill="#fff4dc" stroke="#bfa16b" stroke-width="1.5"/><text x="655.0" y="334.0" text-anchor="middle" class="">物体清单 ＋ 各物体任务要求</text><path d="M450,195 L450,220" class="edge"/><path d="M395,268 L395,285 L260,285 L260,304" class="edge"/><path d="M505,268 L505,285 L655,285 L655,304" class="edge"/><rect x="30" y="402" width="840" height="360" rx="16" fill="#f7f9fc" stroke="#a8bacb" stroke-width="1.5"/><text x="50" y="433" text-anchor="start" class="group">02  执行层 · 运行器与 Decisions</text><rect x="90" y="480" width="300" height="88" rx="12" fill="#eaf2fb" stroke="#6587a7" stroke-width="1.5"/><text x="240.0" y="517.0" text-anchor="middle" class="">运行器</text><text x="240.0" y="543.0" text-anchor="middle" class="">执行当前 Node，沿 Edge 推进</text><rect x="540" y="480" width="270" height="88" rx="12" fill="#eee7fb" stroke="#8a6cad" stroke-width="1.5"/><text x="675.0" y="504.0" text-anchor="middle" class="">Decisions</text><text x="675.0" y="530.0" text-anchor="middle" class="">判断事实</text><text x="675.0" y="556.0" text-anchor="middle" class="">选择可执行恢复边</text><rect x="540" y="646" width="270" height="84" rx="12" fill="#fff4dc" stroke="#bfa16b" stroke-width="1.5"/><text x="675.0" y="668.0" text-anchor="middle" class="">清单记忆</text><text x="675.0" y="694.0" text-anchor="middle" class="">最后观测、已验证关系</text><text x="675.0" y="720.0" text-anchor="middle" class="">该物体的操作记录</text><path d="M260,352 L260,387 L15,387 L15,502 L90,502" class="edge"/><text x="302" y="390" text-anchor="middle" class="small">执行图</text><path d="M655,352 L848,352 L848,689 L810,689" class="edge" stroke-dasharray="6 5"/><path d="M390,502 L540,502" class="edge"/><text x="465" y="490" text-anchor="middle" class="small">判断请求</text><path d="M540,552 L390,552" class="edge"/><text x="465" y="581" text-anchor="middle" class="small">判断结果／选边</text><path d="M675,646 L675,568" class="edge" stroke-dasharray="6 5"/><text x="675" y="620" text-anchor="middle" class="small">读取历史与当前证据</text><text x="240" y="638" text-anchor="middle" class="small">顺序边：成功后继续</text><text x="240" y="664" text-anchor="middle" class="small">条件边：根据判断分流</text><text x="240" y="690" text-anchor="middle" class="small">回环边：补充证据后再判断</text><rect x="30" y="796" width="840" height="206" rx="16" fill="#f7f9fc" stroke="#a8bacb" stroke-width="1.5"/><text x="50" y="827" text-anchor="start" class="group">03  技能层 · 每次执行被选中的能力</text><rect x="90" y="860" width="720" height="66" rx="12" fill="#eaf2fb" stroke="#6587a7" stroke-width="1.5"/><text x="450.0" y="886.0" text-anchor="middle" class="">观测　建图　抓姿　轨迹规划　抓取　放置　处理　核验</text><text x="450.0" y="912.0" text-anchor="middle" class="">技能内部实现固定边界，不在内部偷偷编排下一项任务</text><path d="M170,568 L170,592 L20,592 L20,878 L90,878" class="edge"/><text x="121" y="783" text-anchor="middle" class="small">调用技能</text><path d="M90,908 L5,908 L5,552 L90,552" class="edge"/><text x="118" y="747" text-anchor="start" class="small">返回结果／未知／失败</text><path d="M747,860 L747,730" class="edge" stroke-dasharray="6 5"/><text x="790" y="782" text-anchor="middle" class="small">记录证据</text><text x="450" y="966" text-anchor="middle" class="small">数值几何、碰撞、关节限位由程序检查，不能由模型判断覆盖</text><text x="450" y="1040" text-anchor="middle" class="small">实线：生成、调用和控制转移　　虚线：证据读写</text></svg>