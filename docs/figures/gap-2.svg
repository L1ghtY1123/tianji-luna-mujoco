 text-anchor="middle" class="">最终回位 ＋ 整体核验节点组</text><text x="525.0" y="1301.5" text-anchor="middle" class="">各物体均满足自己的完成要求后才完成任务</text><path d="M205,1152 L205,1282 L245,1282" class="edge"/><text x="450" y="1410" text-anchor="middle" class="small">共享清单，独立目标与进度；不创建 sub-agent，不按物体追加 Responses。</text></svg>